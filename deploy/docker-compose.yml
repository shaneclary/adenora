version: "3.8"

# LOCAL DEV STACK — run: docker-compose -f deploy/docker-compose.yml up
services:
  adenora:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=postgres://adenora:adenora@db/adenora
      - JWT_SECRET=dev-secret-change-in-production
      - RUST_LOG=info,adenora=debug
      - ADENORA_BIND=0.0.0.0:8080
      - BOT_ARENA_ENABLED=true
      - BATCH_INTERVAL_MS=500
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: adenora
      POSTGRES_PASSWORD: adenora
      POSTGRES_DB: adenora
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adenora"]
      interval: 2s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  pgdata:
