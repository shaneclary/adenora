version: "3.8"

# PRODUCTION STACK — Hetzner VPS
# Run: docker-compose -f deploy/docker-compose.prod.yml up -d
services:
  adenora:
    image: ghcr.io/adenora/adenora:latest
    restart: always
    ports:
      - "127.0.0.1:8080:8080"
    env_file:
      - ../.env.production
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
    # No external port — only accessible from adenora container

  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --maxmemory 64mb --maxmemory-policy allkeys-lru
    # No external port

  caddy:
    image: caddy:2-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
      - ../web/build:/srv/web
    depends_on:
      - adenora

  # Daily database backup
  backup:
    image: postgres:16-alpine
    restart: "no"
    volumes:
      - ./backups:/backups
    entrypoint: >
      sh -c "pg_dump -h db -U ${POSTGRES_USER} ${POSTGRES_DB} | gzip > /backups/adenora_$$(date +%Y%m%d_%H%M%S).sql.gz && find /backups -name '*.sql.gz' -mtime +30 -delete"
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      - db

volumes:
  pgdata:
  caddy_data:
  caddy_config:
